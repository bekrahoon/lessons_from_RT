<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="container">
        <h1>Вход в систему</h1>

        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Логин:</label>
                    <input type="text" id="login" placeholder="Введите логин" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                </div>

                <button type="submit">Войти</button>
            </form>

            <div id="message" class="message"></div>

            <div class="test-users">
                <h3>📝 Тестовые аккаунты:</h3>
                <p><strong>admin</strong> / 12345</p>
                <p><strong>user1</strong> / password</p>
                <p><strong>ivan</strong> / ivan123</p>
                <p><strong>maria</strong> / maria456</p>
                <p><strong>john</strong> / john789</p>
                <p><strong>test</strong> / test123</p>
                <p><strong>alex</strong> / alex999</p>
                <p><strong>olga</strong> / olga111</p>
            </div>
        </div>

        <div id="profile" class="profile">
            <h2>Добро пожаловать!</h2>
            <p id="userName" style="font-size: 20px; color: #333; margin: 20px 0;"></p>
            <button class="logout-btn" id="logoutBtn">Выход</button>
        </div>
    </div>

</body>
</html>
